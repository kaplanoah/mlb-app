name: Flaky tests

# Pull requests retry a failed browser test once, so a test that fails only now and then can pass
# them. Each night, main's browser tests run three times over with no retry, and one open issue
# names each test that failed in any run (worker/report-flaky-tests.mjs).
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # Playwright's own image holds Chromium and WebKit and the system libraries they need, so one
  # machine runs every project. Its tag is the Playwright version package.json pins.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run the browser tests three times over
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
        run: npm run test:browser -- --repeat-each=3 --retries=0 --reporter=list,json
      - name: Name each test that failed in the open issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node worker/report-flaky-tests.mjs report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report-nightly
          path: |
            playwright-report/
            test-results/
