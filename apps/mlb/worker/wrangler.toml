name = "mlb-app"
main = "dist/worker.mjs"
compatibility_date = "2026-09-01"
# npm run build -- mlb bundles dist/worker.mjs with esbuild (worker/build.mjs); deploys build it themselves.
no_bundle = true

[observability]
enabled = true

# Traces time each fetch the Worker and its store make, which the logs alone can't show.
[observability.traces]
enabled = true

# worker/deploy.mjs declares the same bindings and migrations for npm run deploy:api.
[[durable_objects.bindings]]
name = "STORE"
class_name = "SeasonStore"

[[ratelimits]]
name = "ACCESS_LIMIT"
namespace_id = "2701"

[ratelimits.simple]
limit = 10
period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeasonStore"]
